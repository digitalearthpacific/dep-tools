name: Run tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  # Probably should add a release process to publish a package we install
  # one day...
  # release:
  #   types:
  #     - created

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check linting
        uses: psf/black@stable
        id: action_black
        with:
          options: "--check" 
          src: "./dep_tools"

  testing:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          pip install . pytest
          pip freeze

      - name: Run tests
        run: pytest tests
